name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so Quartz can read created/modified dates from git

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: site/.quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('site/quartz.lock.json') }}
          restore-keys: ${{ runner.os }}-quartz-plugins-

      - name: Install root dependencies (Marp CLI)
        run: npm ci

      - name: Install Quartz dependencies
        run: npm ci
        working-directory: site

      - name: Install Quartz plugins
        run: npx quartz plugin install
        working-directory: site

      - name: Render lecture decks (HTML + PDF)
        run: npm run lectures # Chrome is preinstalled on ubuntu-latest

      - name: Build Quartz site from wiki/
        run: npx quartz build -d ../wiki
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
